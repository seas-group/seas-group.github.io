name: Update conference deadlines

# Runs on the 1st of every month at 06:00 UTC, and can also be started by hand
# from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the updated content/deadlines.js
  actions: write    # start the Pages deploy workflow afterwards

concurrency:
  group: update-deadlines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch deadlines
        run: |
          pip install pyyaml
          python scripts/update_deadlines.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- content/deadlines.js; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/deadlines.js
            git commit -m "Update conference deadlines ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not trigger other workflows,
      # so start the Pages deployment explicitly.
      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
